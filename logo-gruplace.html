<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Gruplace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap');

  :root{
    --ink:        #0B0E14;
    --brand-a:    #3654FF; /* indigo elétrico */
    --brand-b:    #8B5CF6; /* violeta */
    --brand-grad: linear-gradient(120deg, var(--brand-a), var(--brand-b));
    --f-display:  'Space Grotesk', 'Inter', sans-serif;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--f-display);
    font-weight:700;
    font-size:1.25rem;
    color:var(--ink);
    text-decoration:none;
    cursor:pointer;
    user-select:none;
  }

  .logo-mark{
    width:26px;
    height:26px;
    transition:transform .3s ease;
  }

  .logo:hover .logo-mark{
    transform:translateY(-2px) rotate(-4deg);
  }

  .logo-text em{
    font-style:normal;
    color:var(--brand-a);
  }
</style>
</head>
<body>

  <a class="logo" href="#top" id="gruplaceLogo" aria-label="Gruplace — início">
    <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="6"  r="3.2" fill="#0B0E14"/>
      <circle cx="6"  cy="24" r="3.2" fill="#3654FF"/>
      <circle cx="26" cy="24" r="3.2" fill="#8B5CF6"/>
      <path d="M16 9 L7 21.5 M16 9 L25 21.5 M8.5 24 H23.5"
            stroke="#0B0E14" stroke-width="1.4" stroke-opacity=".35"/>
    </svg>
    <span class="logo-text">Gru<em>place</em></span>
  </a>

  <script>
    // Exemplo simples de comportamento em JS: clique leva ao topo (âncora #top)
    document.getElementById('gruplaceLogo').addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      console.log('Logo Gruplace clicada');
    });
  </script>

</body>
</html>
