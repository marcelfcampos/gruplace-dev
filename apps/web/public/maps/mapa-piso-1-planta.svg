<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" role="img" aria-labelledby="titulo-mapa">
  <title id="titulo-mapa">Gruplace — Mapa do Piso 1</title>

  <defs>
    <style>

      /* ===== Corredores / circulação ===== */
      .corredor { fill: #FFFFFF; stroke: #E4E1D6; stroke-width: 1.5; }
      .pilares { fill: #C7C3B7; }
      .area-central-label {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 1.5px;
        fill: #8B8879;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      /* ===== Lojas ===== */
      .loja { fill: #E8E5DD; stroke: #FFFFFF; stroke-width: 3; }
      .loja-destaque { fill: #111111; stroke: #FFFFFF; stroke-width: 3; }

      /* ===== Nomes das lojas ===== */
      .nome-loja {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 0.4px;
        fill: #35342F;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .nome-loja-destaque {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 0.6px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      /* ===== Ícones / amenidades ===== */
      .icone-bg { fill: #FFFFFF; stroke: #111111; stroke-width: 1.5; }
      .icone-texto {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }
      .icone-label {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 1px;
        fill: #8B8879;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      /* ===== Localização do usuário ===== */
      .user-dot { fill: #2F63E8; stroke: #FFFFFF; stroke-width: 3; }
      .user-pulse { fill: #2F63E8; opacity: 0.35; }
      .user-text {
        font-family: "Bebas Neue", Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 1px;
        font-weight: 700;
        fill: #2F63E8;
        text-anchor: middle;
      }

      /* Animação simples de pulso */
      @keyframes pulse {
        0%   { r: 10; opacity: 0.35; }
        100% { r: 26; opacity: 0; }
      }
      .animate-pulse {
        animation: pulse 1.6s ease-out infinite;
      }
    </style>

    <!-- Ícones reutilizáveis (design minimalista, geométrico) -->
    <g id="pin-info">
      <circle r="14" class="icone-bg" />
      <text x="0" y="0.5" class="icone-texto">i</text>
    </g>
    <g id="pin-parking">
      <circle r="14" class="icone-bg" />
      <text x="0" y="0.5" class="icone-texto">P</text>
    </g>
    <g id="pin-wc">
      <rect x="-14" y="-14" width="28" height="28" rx="8" class="icone-bg" />
      <circle cx="-5" cy="-4" r="3" fill="#111111" />
      <circle cx="5" cy="-4" r="3" fill="#111111" />
      <path d="M -8,3 L -8,9 M -2,3 L -2,9 M 2,3 L 2,9 M 8,3 L 8,9" stroke="#111111" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </defs>

  <!-- ===================== STORES (geometria original preservada) ===================== -->
  <g id="stores">
    <!-- Bloco Âncora Oeste -->
    <path id="loja-ancora-oeste" class="loja" d="M 180,320 L 320,320 L 320,260 L 440,260 L 440,740 L 410,740 L 410,810 L 300,810 L 300,740 L 230,740 L 230,550 L 180,550 L 180,380 L 120,380 L 120,320 Z" />

    <!-- Corredor Superior / Norte (Oeste) -->
    <rect id="loja-101" x="580" y="215" width="160" height="70" class="loja" />
    <rect id="loja-102" x="580" y="285" width="160" height="60" class="loja" />
    <rect id="loja-103" x="580" y="345" width="160" height="60" class="loja" />
    <rect id="loja-104" x="580" y="405" width="160" height="60" class="loja" />

    <rect id="loja-105" x="810" y="215" width="120" height="90" class="loja" />
    <rect id="loja-106" x="810" y="305" width="120" height="70" class="loja" />
    <rect id="loja-107" x="810" y="375" width="120" height="90" class="loja" />

    <!-- Loja em destaque -->
    <rect id="loja-mega" x="870" y="465" width="60" height="140" class="loja-destaque" />

    <!-- Corredor Central e Sul (Oeste) -->
    <rect id="loja-108" x="530" y="500" width="110" height="65" class="loja" />
    <rect id="loja-109" x="530" y="565" width="110" height="65" class="loja" />
    <rect id="loja-110" x="530" y="630" width="110" height="140" class="loja" />

    <rect id="loja-111" x="640" y="660" width="60" height="110" class="loja" />
    <rect id="loja-112" x="700" y="660" width="60" height="110" class="loja" />
    <rect id="loja-113" x="760" y="660" width="80" height="110" class="loja" />

    <!-- Setor Norte Centro-Leste -->
    <rect id="loja-201" x="970" y="215" width="90" height="110" class="loja" />
    <rect id="loja-202" x="1060" y="215" width="90" height="110" class="loja" />
    <rect id="loja-203" x="1150" y="215" width="100" height="110" class="loja" />
    <rect id="loja-204" x="1250" y="215" width="100" height="110" class="loja" />

    <!-- Setor Norte Leste (Parede Alta) -->
    <rect id="loja-205" x="970" y="325" width="110" height="110" class="loja" />
    <rect id="loja-206" x="1080" y="325" width="130" height="110" class="loja" />
    <rect id="loja-207" x="1210" y="325" width="140" height="110" class="loja" />

    <!-- Setor Sul Centro-Leste (Corredor de Pilares) -->
    <rect id="loja-208" x="840" y="660" width="80" height="110" class="loja" />
    <rect id="loja-209" x="920" y="660" width="80" height="110" class="loja" />
    <rect id="loja-210" x="1000" y="660" width="80" height="110" class="loja" />
    <rect id="loja-211" x="1080" y="660" width="90" height="110" class="loja" />
    <rect id="loja-212" x="1170" y="660" width="90" height="110" class="loja" />
    <rect id="loja-213" x="1260" y="660" width="100" height="110" class="loja" />

    <!-- Bloco da Praça Leste / Serviços -->
    <rect id="loja-214" x="1360" y="230" width="110" height="120" class="loja" />
    <rect id="loja-215" x="1360" y="660" width="110" height="120" class="loja" />

    <!-- Bloco Leste / Curvo -->
    <path id="loja-ancora-leste" class="loja" d="M 1360,350 C 1500,380 1650,480 1760,670 L 1680,730 C 1550,600 1450,520 1360,500 Z" />
    <path id="loja-restaurante" class="loja" d="M 1510,500 L 1660,580 L 1630,640 L 1480,560 Z" />
  </g>

  <!-- ===================== STORE LABELS ===================== -->
  <g id="store-labels">
    <text x="280" y="535" class="nome-loja">ÂNCORA OESTE</text>

    <text x="660" y="250" class="nome-loja">LOJA 101</text>
    <text x="660" y="315" class="nome-loja">LOJA 102</text>
    <text x="660" y="375" class="nome-loja">LOJA 103</text>
    <text x="660" y="435" class="nome-loja">CAFÉ</text>

    <text x="870" y="260" class="nome-loja">LOJA 105</text>
    <text x="870" y="340" class="nome-loja">LOJA 106</text>
    <text x="870" y="420" class="nome-loja">LOJA 107</text>

    <!-- Texto vertical para a loja destaque estreita -->
    <text x="900" y="535" class="nome-loja-destaque" transform="rotate(-90 900 535)">MEGA LOJA</text>

    <text x="585" y="532" class="nome-loja">LOJA 108</text>
    <text x="585" y="597" class="nome-loja">LOJA 109</text>
    <text x="585" y="700" class="nome-loja">LOJA 110</text>

    <text x="670" y="715" class="nome-loja">111</text>
    <text x="730" y="715" class="nome-loja">112</text>
    <text x="800" y="715" class="nome-loja">113</text>

    <text x="1015" y="270" class="nome-loja">MODA INFANTIL</text>
    <text x="1105" y="270" class="nome-loja">CALÇADOS</text>
    <text x="1200" y="270" class="nome-loja">DECORAÇÃO</text>
    <text x="1300" y="270" class="nome-loja">TECH GEEK</text>

    <text x="1025" y="380" class="nome-loja">CHAVEIRO</text>
    <text x="1145" y="380" class="nome-loja">DOCERIA</text>
    <text x="1280" y="380" class="nome-loja">SALÃO BELEZA</text>

    <text x="880" y="715" class="nome-loja">114</text>
    <text x="960" y="715" class="nome-loja">115</text>
    <text x="1040" y="715" class="nome-loja">LIVRARIA</text>
    <text x="1125" y="715" class="nome-loja">BRINQUEDOS</text>
    <text x="1215" y="715" class="nome-loja">ESPORTES</text>
    <text x="1310" y="715" class="nome-loja">PERFUMARIA</text>

    <text x="1415" y="290" class="nome-loja">ARTESANATO</text>
    <text x="1415" y="720" class="nome-loja">CONVENIÊNCIA</text>
    <text x="1530" y="530" class="nome-loja">ÂNCORA LESTE</text>
    <text x="1570" y="570" class="nome-loja">RESTAURANTE</text>
  </g>

  <!-- ===================== CORRIDORS (geometria original preservada) ===================== -->
  <g id="corridors">
    <!-- Corredor principal -->
    <path class="corredor" d="M 440,465 L 740,465 L 740,345 L 810,345 L 810,605 L 740,605 L 740,660 L 970,660 L 970,435 L 1080,435 L 1080,605 L 1470,605 L 1520,690 L 1380,780 L 1360,660 L 1080,660 L 1080,780 L 970,780 L 970,660 L 440,660 Z" />

    <!-- Rotunda / Praça central -->
    <circle id="praca-oeste" cx="775" cy="635" r="45" class="corredor" />
    <circle id="praca-leste" cx="1510" cy="635" r="55" class="corredor" />
    <text x="1510" y="605" class="area-central-label">PRAÇA</text>

    <!-- Pilares -->
    <g id="pillars">
      <rect x="880" y="625" width="18" height="18" class="pilares" />
      <rect x="940" y="625" width="18" height="18" class="pilares" />
      <rect x="1000" y="625" width="18" height="18" class="pilares" />
      <rect x="1150" y="625" width="18" height="18" class="pilares" />
      <rect x="1210" y="625" width="18" height="18" class="pilares" />
    </g>
  </g>

  <!-- ===================== AMENITIES (posições originais preservadas) ===================== -->
  <g id="amenities">
    <!-- Informações -->
    <use href="#pin-info" x="775" y="635" />
    <use href="#pin-info" x="1540" y="810" />

    <!-- Estacionamento -->
    <use href="#pin-parking" x="740" y="180" />
    <use href="#pin-parking" x="810" y="180" />

    <!-- Sanitários -->
    <g id="sanitarios" transform="translate(1100, 790)">
      <use href="#pin-wc" x="14" y="14" />
      <use href="#pin-wc" x="49" y="14" />
      <use href="#pin-wc" x="84" y="14" />
      <use href="#pin-wc" x="119" y="14" />
      <text x="66" y="42" class="icone-label">SANITÁRIOS</text>
    </g>
  </g>

  <!-- ===================== USER LOCATION (para controle do React) ===================== -->
  <g id="user-location" transform="translate(680, 535)">
    <circle cx="0" cy="0" r="10" class="user-pulse animate-pulse" />
    <circle cx="0" cy="0" r="10" class="user-dot" />
    <text x="0" y="30" class="user-text">VOCÊ ESTÁ AQUI</text>
  </g>
</svg>
